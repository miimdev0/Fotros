# Builds an UNSIGNED-FOR-STORE debug APK of FETROS on GitHub's free runners.
# Run it from the Actions tab (Run workflow). Download the artifact "fetros-debug-apk".
# The APK is signed with Android's debug key. It is for testing only, not for Google Play.
name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fetros/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android@v3 fails on current runners because it asks for
      # the retired "tools" SDK package. The GitHub runner already ships an Android SDK
      # (ANDROID_HOME is set), so we only accept licences and add the packages we need.
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME" >&2
            exit 1
          fi
          (yes || true) | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Install Capacitor CLI (build-time only)
        run: npm install --no-save @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Generate the Android project (first build only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/fetros-debug.apk
          ls -la out

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetros-debug-apk
          path: out/fetros-debug.apk
          if-no-files-found: error
          retention-days: 14
